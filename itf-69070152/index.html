<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodPicker | สุ่มเมนูอาหาร</title>
  <!-- Google Fonts: Itim (หัวข้อน่ารัก) + Mali (เนื้อหาอ่านง่าย) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Cute Pastel Palette */
      --bg: #FFFAFD;              /* Off White อมชมพูเล็กน้อย */
      --card-bg: #FFFFFF;
      --mint: #A7EFD3;            /* Mint */
      --light-mint: #DDF8EC;      /* Light Mint */
      --lavender: #C4AEFF;        /* Lavender */
      --light-lavender: #EEE8FF;  /* Light Lavender */
      --pastel-pink: #F4A9D4;     /* Pastel Pink */
      --light-pink: #FCE1F0;      /* Light Pink */
      --soft-yellow: #FFE18A;     /* Soft Yellow */
      --price-yellow: #FFEAA0;    /* Price Badge */
      --text-main: #565064;       /* ข้อความทั่วไป */
      --text-dark: #675A80;       /* ชื่อเมนู */
      --text-muted: #8E82A8;      /* คำอธิบาย */
      --border-lavender: #E6DDFF; /* ขอบจาง ๆ */
      --shadow-card: 0 14px 34px rgba(196, 174, 255, 0.16);
      --shadow-hover: 0 20px 44px rgba(196, 174, 255, 0.22);
      --shadow-btn: 0 8px 20px rgba(169, 139, 255, 0.4);
      --radius: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Mali", "Sarabun", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* -------------------- แสงพาสเทลจาง ๆ รอบขอบ (ตรงกลางเกือบขาว) -------------------- */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(128px);
      opacity: 0.42;
      z-index: -1;
      pointer-events: none;
    }
    .blob-1 {
      top: -8%;
      left: -10%;
      width: 480px;
      height: 480px;
      background: #B8F1DC; /* Mint ชัดขึ้นเล็กน้อย */
    }
    .blob-2 {
      bottom: -12%;
      right: -12%;
      width: 560px;
      height: 560px;
      background: #D6C9FF; /* Lavender ชัดขึ้นเล็กน้อย */
      opacity: 0.5;
    }
    .blob-3 {
      top: 32%;
      right: -8%;
      width: 320px;
      height: 320px;
      background: #F7C8E2; /* Soft Pink */
      opacity: 0.4;
    }

    /* -------------------- Navbar -------------------- */
    .navbar {
      width: 100%;
      max-width: 900px;
      padding: 1rem 1.5rem;
      background: rgba(255, 252, 254, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-lavender);
      box-shadow: 0 4px 18px rgba(196, 174, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Mali", sans-serif;
      position: sticky;
      top: 0;
      z-index: 10;
      border-radius: 0 0 24px 24px;
    }

    .nav-brand {
      font-family: "Itim", "Mali", cursive;
      font-size: 2rem;
      font-weight: 400;
      /* Gradient สี Lavender → Pink → Mint */
      background: linear-gradient(90deg, #A98BFF 0%, #F07CC0 50%, #5FD3A8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.03em;
    }

    .nav-item {
      font-size: 1rem;
      color: var(--text-main);
      font-weight: 600;
    }

    /* -------------------- ข้อความแนะนำ -------------------- */
    .hero {
      margin-top: 1.5rem;
      font-family: "Itim", "Mali", cursive;
      font-size: 1.3rem;
      color: var(--text-muted);
      text-align: center;
      font-weight: 400;
    }

    .hero .sparkle {
      color: var(--pastel-pink);
      margin: 0 4px;
    }

    /* -------------------- Food Card -------------------- */
    .card-wrapper {
      width: 100%;
      max-width: 380px;
      margin: 1.8rem 1rem 3rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      width: 100%;
      border: 1.5px solid var(--border-lavender);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    /* กรอบรูปอาหาร + Placeholder ในตัว */
    .img-frame {
      position: relative;
      width: calc(100% - 24px);
      height: 230px;
      margin: 12px auto 0;
      background: linear-gradient(135deg, var(--light-mint) 0%, var(--light-lavender) 100%);
      border: 3px solid var(--mint);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(167, 239, 211, 0.28);
    }

    /* Placeholder จะเห็นเมื่อยังไม่มีรูปจริง */
    .img-frame::before {
      content: "🍽️";
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.2rem;
      z-index: 0;
      opacity: 0.9;
    }

    .img-frame::after {
      content: "พื้นที่รูปอาหาร";
      position: absolute;
      bottom: 1.4rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Mali", sans-serif;
      font-size: 0.95rem;
      color: var(--text-muted);
      z-index: 0;
      white-space: nowrap;
    }

    .card-img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 1.6rem 1.4rem 1.6rem;
      text-align: center;
    }

    /* Price Badge */
    .price-badge {
      display: inline-block;
      background: var(--price-yellow);
      color: #8A7020;
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      font-family: "Mali", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      box-shadow: 0 3px 8px rgba(255, 234, 160, 0.5);
    }

    /* ชื่อเมนู */
    .card-name {
      font-family: "Itim", "Mali", cursive;
      font-size: 2.2rem;
      color: var(--text-dark);
      margin-bottom: 0.4rem;
      font-weight: 400;
      line-height: 1.3;
    }

    /* คำอธิบาย */
    .card-desc {
      font-size: 1.02rem;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.7;
    }

    .card-sparkles {
      margin-top: 0.9rem;
      font-size: 1.3rem;
      letter-spacing: 0.15em;
    }

    .card-sparkles .spark {
      color: var(--lavender);
    }

    .card-sparkles .heart {
      color: var(--pastel-pink);
    }

    /* -------------------- ปุ่มสุ่มอาหาร -------------------- */
    .pick-container {
      width: 100%;
      max-width: 380px;
      margin: 0 1rem 3rem 1rem; /* margin ซ้าย/ขวาให้ตรงกับ .card-wrapper */
      display: flex;
      justify-content: center;
    }

    .pick-btn {
      background: linear-gradient(135deg, #A98BFF 0%, #F08CC8 100%);
      color: #ffffff;
      border: none;
      padding: 1rem 2.4rem;
      border-radius: 999px;
      font-family: "Mali", sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-shadow: 0 1px 2px rgba(90, 70, 130, 0.18);
    }

    .pick-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 26px rgba(169, 139, 255, 0.52);
      filter: brightness(1.06);
    }

    .pick-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 5px 12px rgba(169, 139, 255, 0.35);
    }

    .pick-btn:focus-visible {
      outline: 3px solid var(--pastel-pink);
      outline-offset: 3px;
    }

    /* -------------------- Responsive -------------------- */
    @media (max-width: 480px) {
      .navbar {
        max-width: 100%;
        padding: 1rem 1rem;
        border-radius: 0 0 20px 20px;
      }
      .nav-brand {
        font-size: 1.6rem;
      }
      .nav-item {
        font-size: 0.95rem;
      }
      .hero {
        font-size: 1.1rem;
        margin-top: 1rem;
      }
      .img-frame {
        height: 190px;
        border-radius: 18px;
      }
      .card-body {
        padding: 1.4rem 1.1rem 1.4rem;
      }
      .card-name {
        font-size: 1.9rem;
      }
      .pick-btn {
        font-size: 1rem;
        padding: 0.9rem 2rem;
        width: 100%;
        max-width: 260px;
        justify-content: center;
      }
      .blob-1 {
        width: 320px;
        height: 320px;
      }
      .blob-2 {
        width: 380px;
        height: 380px;
      }
    }

    @media (max-width: 360px) {
      .navbar {
        padding: 0.9rem 0.8rem;
      }
      .img-frame {
        height: 170px;
      }
    }
  </style>
</head>
<body>

  <!-- แสงพาสเทลจาง ๆ รอบขอบ (Mint + Lavender + Pink) -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Navbar -->
  <nav class="navbar" aria-label="หลักการนำทางเว็บไซต์">
    <div class="nav-item" title="รหัสนักศึกษา">🎓 69070152</div>
    <div class="nav-brand">FOODPICKER</div>
    <div class="nav-item">Week 17</div>
  </nav>

  <main>
    <p class="hero">กดปุ่มด้านล่างเพื่อ <span class="sparkle">✨</span>สุ่มเมนูอาหาร<span class="sparkle">✨</span></p>

    <!-- Food Card -->
    <div class="card-wrapper">
      <div class="card" role="region" aria-label="บัตรเมนูอาหาร">
        <div class="img-frame">
          <!-- เริ่มต้นด้วยภาพโปร่งใส เพื่อให้ Placeholder ด้านหลังแสดงแทน ไม่เกิด Broken Image -->
          <img id="food-img" class="card-img"
               src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
               alt="รูปภาพอาหาร"
               onerror="this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';">
        </div>
        <div class="card-body">
          <span id="price-badge" class="price-badge">฿0</span>
          <h2 id="food-name" class="card-name">—</h2>
          <p id="food-desc" class="card-desc">รอการสุ่มเมนู...</p>
          <div class="card-sparkles">
            <span class="spark">✦</span>
            <span class="heart">♡</span>
            <span class="spark">✦</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ปุ่มสุ่มเมนูอาหาร -->
    <div class="pick-container">
      <button id="pick-btn" class="pick-btn" type="button">
        <span class="btn-icon">✦</span> สุ่มเมนูอาหาร <span class="btn-icon">✦</span>
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
